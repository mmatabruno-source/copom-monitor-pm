name: Watchdog Monitor Copom

on:
  schedule:
    # Uma vez por dia, fora das janelas densas — detecta ausência prolongada ou
    # falhas repetidas do workflow principal (monitor-copom.yml), não substitui o
    # baseline de 3h em si.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  verificar-saude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar watchdog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.watchdog
