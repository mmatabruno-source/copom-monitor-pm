name: Monitor Copom

on:
  schedule:
    # Baseline: a cada 3h, todos os dias do ano (fonte de verdade é sempre a API, nunca o calendário)
    - cron: "0 */3 * * *"
    # Janela densa de terça-feira (publicação típica da Ata, 8h BRT): a cada 15 min, 10:45-13:00 UTC
    - cron: "45,0,15,30 11-12 * * 2"
    - cron: "45 10 * * 2"
    - cron: "0 13 * * 2"
    # Janela densa de quarta-feira (publicação típica do Comunicado, ~18h30 BRT): a cada 15 min, 21:15-23:45 UTC
    - cron: "15,30,45 21 * * 3"
    - cron: "0,15,30,45 22 * * 3"
    - cron: "0,15,30,45 23 * * 3"
  workflow_dispatch: {}

concurrency:
  group: monitor-copom
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar verificação
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      - name: Commitar histórico atualizado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico/ estado.json
          git diff --cached --quiet || git commit -m "Atualiza histórico do Copom [skip ci]"

          # Falha transitória de rede não pode perder um commit local (runner é
          # efêmero) — tenta sincronizar com o remoto algumas vezes antes de desistir.
          tentativas=3
          espera=5
          sucesso=false
          for tentativa in $(seq 1 "$tentativas"); do
            if git pull --rebase --autostash origin main && git push; then
              sucesso=true
              break
            fi
            echo "Falha ao sincronizar com o repositório remoto (tentativa $tentativa/$tentativas)"
            if [ "$tentativa" -lt "$tentativas" ]; then
              sleep "$espera"
              espera=$((espera * 2))
            fi
          done

          # FR-011: se a persistência falhar mesmo após novas tentativas — e a
          # notificação já pode ter sido entregue ao usuário nesta execução —, avisa
          # sobre o risco de notificação duplicada na próxima execução.
          if [ "$sucesso" = false ]; then
            python -c "from src.notificar_falha import notificar_falha; notificar_falha('persistência do estado após notificação', 'sincronização com o Git falhou após tentativas — pode haver notificação duplicada na próxima execução')"
            exit 1
          fi
